const_tag: &ORB "ORB"
const_tag: &ALIKED "ALIKED"

# Global config properties
global:
  load_video: "kyoto"
  feature_extractor: *ALIKED
  enable_multiscale_features: false
  enable_ba: true
  record_session: false 
  display_capture: true 
  enable_debug: true
  enable_profiling: false

