[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "native"
# The wheel ships ONLY the compiled extension; the slam/ package stays
# importable from the repo checkout (benchmarks and slam.py run from
# the repo root).
wheel.packages = []
build-dir = "build/{wheel_tag}"

[project]
name = "sparse-slam"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorama>=0.4.6",
    "g2o-python>=0.0.12",
    "numpy<2",
    "open3d>=0.20.0",
    "opencv-python>=4,<5",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# geocalib is a torch inference package: since phase 23 moved
# torch/torchvision out of CORE deps (only super_point.py imported
# them), this extra must declare torch itself to stay
# self-sufficient (measured: the desktop re-provision dropped torch
# and the fx:auto calibration path failed with 'No module named
# torch').
calib = [
    "geocalib",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]
# Phase 23: learned extractors/matchers live behind this extra
# (SuperPoint - the only torch consumer - was removed). Phase 24:
# ALIKED + LightGlue joined it from cvg/LightGlue at a pinned rev
# (the geocalib git-source precedent); weights download on demand,
# never committed.
learned = [
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "lightglue @ git+https://github.com/cvg/LightGlue@5a650c444718caffc2669dc0094cde908f42dd73",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
geocalib = { git = "https://github.com/cvg/GeoCalib" }
